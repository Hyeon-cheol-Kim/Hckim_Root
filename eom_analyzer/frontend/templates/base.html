<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PAM4 EOM Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app">
    <!-- 왼쪽 플로팅 사이드바 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">◉</div>
        <div class="brand-name">EOM Agent</div>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav">
        <a class="nav-item {{ 'active' if active=='convert' }}" href="/convert">
          <span class="ni-ico">⇄</span> EOM 변환
        </a>
        <a class="nav-item {{ 'active' if active=='analysis' }}" href="/analysis">
          <span class="ni-ico">▤</span> DB 분석
        </a>
      </nav>
      <div class="sidebar-foot">
        <span class="dot"></span> Agent online
      </div>
    </aside>

    <!-- 작업 영역 -->
    <main class="content">
      <header class="page-head">
        <div>
          <div class="crumb">{% block crumb %}{% endblock %}</div>
          <h1 class="page-title">{% block heading %}{% endblock %}</h1>
        </div>
        <div class="page-actions">{% block actions %}{% endblock %}</div>
      </header>
      {% block body %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
